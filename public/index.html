<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RICO BOT</title>
<link rel="icon" href="/anime.jpg">
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --neon:#2dff8f; --txt:#d9ffe9; }
  * { box-sizing:border-box; margin:0; }
  html,body { min-height:100%; }
  body {
    font-family:'Cairo',system-ui,sans-serif; color:var(--txt);
    background:linear-gradient(135deg,#02150a,#0b4a26,#03200f,#0f6b35);
    background-size:400% 400%; animation:flow 16s ease infinite;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  @keyframes flow { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
  .card {
    width:100%; max-width:400px; text-align:center; padding:28px 22px 30px;
    background:rgba(3,26,13,.72); border:1px solid rgba(45,255,143,.35);
    border-radius:26px; backdrop-filter:blur(8px);
    box-shadow:0 0 40px rgba(45,255,143,.18), inset 0 0 30px rgba(45,255,143,.05);
  }
  .stage { position:relative; width:300px; height:300px; margin:-10px auto 0; max-width:100%; }
  canvas { position:absolute; inset:0; width:100%; height:100%; }
  .avatar {
    position:absolute; top:50%; left:50%; width:160px; height:160px;
    transform:translate(-50%,-50%); border-radius:50%; overflow:hidden;
    border:3px solid var(--neon); box-shadow:0 0 28px var(--neon);
    background:#0b4a26;
  }
  .avatar img { width:100%; height:100%; object-fit:cover; display:block; }
  h1 {
    font-family:'Audiowide',sans-serif; font-weight:400; font-size:2.6rem;
    letter-spacing:.14em; margin:4px 0 10px; direction:ltr;
    background:linear-gradient(90deg,#b6ffd7,#2dff8f,#b6ffd7);
    background-size:200% 100%; -webkit-background-clip:text; background-clip:text;
    color:transparent; animation:shine 3s linear infinite;
    filter:drop-shadow(0 0 10px rgba(45,255,143,.6));
  }
  @keyframes shine { to { background-position:200% 0; } }
  p.lead { line-height:1.8; margin-bottom:18px; font-size:1.02rem; }
  input {
    width:100%; padding:14px 16px; font-size:1.3rem; text-align:center; direction:ltr;
    letter-spacing:.12em; color:#fff; background:rgba(0,0,0,.35);
    border:1.5px solid rgba(45,255,143,.5); border-radius:14px; outline:none;
    font-family:inherit;
  }
  input:focus { border-color:var(--neon); box-shadow:0 0 16px rgba(45,255,143,.45); }
  button {
    width:100%; margin-top:14px; padding:14px; font-size:1.15rem; font-weight:700;
    font-family:inherit; color:#021a0c; background:var(--neon); border:0;
    border-radius:14px; cursor:pointer; box-shadow:0 0 22px rgba(45,255,143,.55);
    transition:transform .15s, box-shadow .15s;
  }
  button:active { transform:scale(.97); }
  button:disabled { opacity:.6; cursor:wait; }
  button:focus-visible, input:focus-visible { outline:3px solid #fff; outline-offset:2px; }
  .msg { min-height:1.4em; margin-top:12px; font-size:.95rem; }
  .err { color:#ff9a9a; }
  .box { display:none; margin-top:18px; padding:16px; border-radius:16px; background:rgba(0,0,0,.35); border:1px dashed var(--neon); }
  .code { font-family:'Audiowide',monospace; font-size:2rem; letter-spacing:.18em; direction:ltr; color:var(--neon); text-shadow:0 0 14px var(--neon); margin:6px 0 10px; }
  .steps { text-align:right; font-size:.92rem; line-height:1.9; opacity:.92; }
  .ok h2 { font-size:1.4rem; margin-bottom:6px; color:var(--neon); }
  @media (prefers-reduced-motion:reduce) { body,h1 { animation:none; } }
</style>
</head>
<body>
<main class="card">
  <div class="stage">
    <canvas id="fx" width="600" height="600"></canvas>
    <div class="avatar"><img id="av" src="/anime.jpg" alt="RICO BOT"></div>
  </div>
  <h1>RICO BOT</h1>
  <p class="lead">مرحبا بك في ريكو بوت لتنصيب الأرقام<br>اكتب رقمك لتوليد كود</p>

  <div id="form">
    <input id="num" type="tel" inputmode="numeric" placeholder="249*****" maxlength="16" autocomplete="off">
    <button id="go">تنصيب</button>
  </div>
  <div id="msg" class="msg"></div>

  <div id="codeBox" class="box">
    <div>كودك:</div>
    <div id="code" class="code"></div>
    <div class="steps">
      1. افتح واتساب ← الأجهزة المرتبطة<br>
      2. اضغط ربط جهاز ← الربط برقم الهاتف بدلا من ذلك<br>
      3. اكتب الكود فوق
    </div>
    <div class="msg">في انتظار الربط...</div>
  </div>

  <div id="okBox" class="box ok">
    <h2>🎉 تهانينا!</h2>
    <div>تم ربط رقمك <b id="okNum" dir="ltr"></b> بـ RICO BOT بنجاح.</div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
let poller;

function setMsg(t, cls) { $('msg').textContent = t || ''; $('msg').className = 'msg ' + (cls || ''); }
function resetBtn() { $('go').disabled = false; $('go').textContent = 'تنصيب'; }

$('go').onclick = async () => {
  const number = $('num').value.replace(/\D/g, '');
  setMsg('');
  if (number.length < 8) return setMsg('اكتب رقمك كامل بالصيغة الدولية، مثل 249xxxxxxxxx', 'err');
  $('go').disabled = true; $('go').textContent = 'جاري توليد الكود...';
  try {
    const r = await fetch('/api/pair', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ number })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'حصل خطأ');
    if (d.status === 'open') return done(number);
    $('form').style.display = 'none';
    $('code').textContent = (d.code || '').replace(/(.{4})(.{4})/, '$1-$2');
    $('codeBox').style.display = 'block';
    poll(number);
  } catch (e) {
    setMsg(e.message, 'err'); resetBtn();
  }
};

function poll(number) {
  let tries = 0;
  clearInterval(poller);
  poller = setInterval(async () => {
    tries++;
    try {
      const d = await (await fetch('/api/status/' + number)).json();
      if (d.status === 'open') return done(number);
      if (d.status === 'none' || tries > 95) {
        clearInterval(poller);
        $('codeBox').style.display = 'none';
        $('form').style.display = 'block';
        resetBtn();
        setMsg('انتهت صلاحية الكود، اضغط تنصيب مرة ثانية.', 'err');
      }
    } catch {}
  }, 2000);
}

function done(number) {
  clearInterval(poller);
  $('form').style.display = 'none';
  $('codeBox').style.display = 'none';
  setMsg('');
  $('okNum').textContent = number;
  $('okBox').style.display = 'block';
}

// ---------- الموجات الكهربية حول الدائرة ----------
const cv = $('fx'), cx = cv.getContext('2d');
const C = 300, R0 = 86, reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

function bolt(angle, len) {
  let r = R0 + 6, a = angle;
  cx.beginPath();
  cx.moveTo(C + Math.cos(a) * r, C + Math.sin(a) * r);
  while (r < R0 + len) {
    r += 10 + Math.random() * 14;
    a += (Math.random() - .5) * .22;
    cx.lineTo(C + Math.cos(a) * r, C + Math.sin(a) * r);
  }
  cx.stroke();
}

function frame() {
  cx.clearRect(0, 0, 600, 600);
  cx.lineCap = 'round'; cx.lineJoin = 'round';
  const t = Date.now() / 1000;
  for (let i = 0; i < 3; i++) {
    const p = (t * .5 + i / 3) % 1;
    cx.strokeStyle = 'rgba(45,255,143,' + (.5 * (1 - p)) + ')';
    cx.lineWidth = 2;
    cx.beginPath(); cx.arc(C, C, R0 + 10 + p * 120, 0, 7); cx.stroke();
  }
  if (!reduce) {
    cx.shadowColor = '#2dff8f'; cx.shadowBlur = 14;
    for (let i = 0; i < 7; i++) {
      cx.strokeStyle = 'rgba(190,255,220,' + (.45 + Math.random() * .5) + ')';
      cx.lineWidth = 1 + Math.random() * 1.6;
      bolt(Math.random() * Math.PI * 2, 45 + Math.random() * 85);
    }
    cx.shadowBlur = 0;
  }
}
frame();
if (!reduce) setInterval(frame, 110);
</script>
</body>
  </html>
