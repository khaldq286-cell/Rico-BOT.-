<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RICO BOT</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg"></div>
<div id="banner" class="banner hidden"></div>
<main>
  <h1 class="logo">RICO <span>BOT</span></h1>
  <p class="sub">منصة تنصيب بوتات واتساب</p>

  <section id="formView" class="card">
    <label for="phone">رقم الواتساب مع مفتاح الدولة</label>
    <input id="phone" type="tel" inputmode="numeric" placeholder="249*****" dir="ltr" autocomplete="off">
    <button id="go" class="btn">تنصيب البوت</button>
    <p id="err" class="err"></p>
  </section>

  <section id="codeView" class="card hidden">
    <div class="ring">
      <svg viewBox="0 0 200 200">
        <circle class="track" cx="100" cy="100" r="90"/>
        <circle id="arc" class="arc" cx="100" cy="100" r="90"/>
      </svg>
      <div class="ring-in">
        <div id="code" class="code" dir="ltr">--------</div>
        <div id="timer" class="timer">120</div>
      </div>
    </div>
    <button id="copy" class="btn">نسخ الرمز</button>
    <ol class="steps">
      <li>افتح واتساب ← الأجهزة المرتبطة</li>
      <li>اختار «ربط برقم الهاتف بدلاً من ذلك»</li>
      <li>الصق الرمز قبل ما الدائرة تنتهي</li>
    </ol>
  </section>

  <section id="doneView" class="card hidden">
    <div class="big">🎉</div>
    <h2>مبروك! تم ربط رقمك</h2>
    <p>بوتك شغّال دلوقتي. اكتب <b dir="ltr">.اوامر</b> في واتساب.</p>
  </section>

  <section id="failView" class="card hidden">
    <div class="big">⌛</div>
    <h2>انتهت المهلة</h2>
    <p>ما اتربط الرقم. جرّب مرة تانية.</p>
    <button id="retry" class="btn">حاول تاني</button>
  </section>
</main>
<script src="script.js"></script>
</body>
          </html>
